services:
  information:
    build: .
    environment:
      INFORMATION_API_KEYS: ${INFORMATION_API_KEYS:?set caller credentials}
      INFORMATION_ADMIN_PASSWORD: ${INFORMATION_ADMIN_PASSWORD:?set administrator credential}
    ports:
      - "127.0.0.1:${INFORMATION_PORT:-8765}:8765"
    volumes:
      - articles:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  articles:
