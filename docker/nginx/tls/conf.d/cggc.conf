# ai.cggc.tech — second public domain (Aliyun DigiCert cert)

# HTTP: ACME challenge + redirect to HTTPS.
# Note: Aliyun intercepts port 80 for domains without an ICP filing, so this
# block only takes effect locally / after filing.
server {
    listen 80;
    server_name ai.cggc.tech www.ai.cggc.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ai.cggc.tech www.ai.cggc.tech;

    ssl_certificate     /etc/nginx/ssl/ai.cggc.tech.pem;
    ssl_certificate_key /etc/nginx/ssl/ai.cggc.tech.key;

    client_max_body_size 1024m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    location / {
        proxy_pass http://frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
