services:
  tls-proxy:
    image: docker.m.daocloud.io/library/nginx:1.30-alpine
    container_name: bisheng-tls-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - bisheng

networks:
  bisheng:
    external: true
    name: bisheng-network